services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api-ubuntu:
    build: ./api
    container_name: container_api_ubuntu
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    volumes:
      - ./datos:/app/datos
    depends_on:
      - db

  dashboard:
    build: ./dashboard
    container_name: container_python_dash
    ports:
      - "8050:8050"
    environment:
      - API_HOST=api-ubuntu
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
      - api-ubuntu

volumes:
  pgdata: